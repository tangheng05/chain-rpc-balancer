name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  haproxy-config:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        haproxy: ['2.8', '3.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: STATS_PASSWORD=ci-only node src/gen-haproxy.js nodes.example.json > haproxy.cfg
      - run: docker run --rm -v "$PWD/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" haproxy:${{ matrix.haproxy }} haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
